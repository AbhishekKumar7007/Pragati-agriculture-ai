{% extends "base.html" %}
{% block title %}Log in · Pragati{% endblock %}
{% block content %}
<div class="auth-wrap"><form method="post" class="panel auth-panel">
  <div class="eyebrow">GOOD TO SEE YOU</div><h1>Log in</h1><p class="muted">Sign in to continue to your Pragati farmer dashboard.</p>
  <label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label>
  <label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Your password"></label>
  <button class="btn primary full" type="submit">Log in</button>
  <p class="small center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</form></div>
{% endblock %}
