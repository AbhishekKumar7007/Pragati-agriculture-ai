{% extends "base.html" %}
{% block title %}Verify email · Pragati{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form method="post" class="panel auth-panel">
    <div class="eyebrow">ONE MORE STEP</div>
    <h1>Verify your email</h1>
    <p class="muted">Enter the six-digit code sent to <strong>{{ email }}</strong>. The code expires in 10 minutes.</p>
    <label>Verification code
      <input name="otp" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required placeholder="123456">
    </label>
    <button class="btn primary full" type="submit">Verify email</button>
  </form>
  <form method="post" action="{{ url_for('resend_otp') }}" class="resend-form">
    <button class="btn secondary full" type="submit">Resend verification code</button>
  </form>
</div>
{% endblock %}
